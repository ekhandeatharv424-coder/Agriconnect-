<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriConnect Fertilizer Recommendation</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef8ee;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

nav{
margin-top:10px;
}

nav a{
color:white;
text-decoration:none;
margin:10px;
font-weight:bold;
}

.container{
width:90%;
max-width:900px;
margin:30px auto;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card h2{
text-align:center;
color:#2e7d32;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

select{
width:100%;
padding:12px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:8px;
background:#2e7d32;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.result{
display:none;
margin-top:30px;
background:#f4fff4;
padding:20px;
border-radius:10px;
border-left:6px solid green;
}

.result h3{
color:#2e7d32;
}

footer{
margin-top:40px;
background:#2e7d32;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<header>

<h1>🌱 Fertilizer Recommendation</h1>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="weather.html">Weather</a>

<a href="cropinfo.html">Crop Info</a>

<a href="market.html">Market</a>

<a href="scheme.html">Schemes</a>

</nav>

</header>

<div class="container">

<div class="card">

<h2>Get Smart Fertilizer Recommendation</h2>

<label>Select Crop</label>

<select id="crop">

<option value="">Select Crop</option>

<option>Tomato</option>

<option>Onion</option>

<option>Potato</option>

<option>Rice</option>

<option>Wheat</option>

<option>Maize</option>

<option>Soybean</option>

<option>Cotton</option>

<option>Sugarcane</option>

<option>Banana</option>

<option>Mango</option>

<option>Grapes</option>

<option>Groundnut</option>

<option>Tur</option>

<option>Moong</option>

<option>Urad</option>

<option>Jowar</option>

<option>Bajra</option>

<option>Sunflower</option>

<option>Chilli</option>

</select>
<label>Select Soil Type</label>

<select id="soil">

<option value="">Select Soil</option>

<option>Black Soil</option>

<option>Red Soil</option>

<option>Loamy Soil</option>

<option>Sandy Soil</option>

<option>Clay Soil</option>

<option>Alluvial Soil</option>

</select>

<label>Select Season</label>

<select id="season">

<option value="">Select Season</option>

<option>Kharif</option>

<option>Rabi</option>

<option>Zaid</option>

</select>

<button onclick="recommendFertilizer()">

🌱 Get Recommendation

</button>

<button onclick="downloadPDF()">

📄 Download PDF

</button>

<div id="result" class="result">

<h3>🌿 Recommendation Result</h3>

<p><b>Fertilizer :</b> <span id="fertilizer">--</span></p>

<p><b>Quantity :</b> <span id="quantity">--</span></p>

<p><b>Best Time :</b> <span id="time">--</span></p>

<p><b>Irrigation :</b> <span id="irrigation">--</span></p>

<p><b>Advice :</b></p>

<p id="advice">--</p>

</div>

</div>

</div>

<footer>

<h2>🌾 AgriConnect</h2>

<p>Smart Fertilizer Recommendation System</p>

</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="fertilizer.js"></script>

</body>

</html>
