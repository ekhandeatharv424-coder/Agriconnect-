<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriConnect Crop Information</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef8ee;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

select{
width:100%;
padding:12px;
font-size:16px;
margin:15px 0;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.result{
margin-top:25px;
background:#f4fff4;
padding:20px;
border-radius:10px;
display:none;
}

</style>

</head>

<body>

<header>

<h1>🌾 Crop Information System</h1>

</header>

<div class="container">

<h2>Select Crop</h2>
<input
type="text"
id="searchCrop"
placeholder="🔍 Search Crop..."
onkeyup="searchCrop()">

<br><br>
<select id="crop">

<option value="">-- Select Crop --</option>

<option>Tomato</option>
<option>Potato</option>
<option>Onion</option>
<option>Rice</option>
<option>Wheat</option>
<option>Cotton</option>
<option>Sugarcane</option>
<option>Soybean</option>
<option>Groundnut</option>
<option>Banana</option>
<option>Jowar</option>
<option>Bajra</option>
<option>Maize</option>
<option>Tur</option>
<option>Moong</option>
<option>Urad</option>
<option>Sunflower</option>
<option>Grapes</option>
<option>Mango</option>
<option>Papaya</option>
<option>Pomegranate</option>
<option>Orange</option>
<option>Lemon</option>
<option>Coconut</option>
<option>Guava</option>
<option>Chilli</option>
<option>Brinjal</option>
<option>Cabbage</option>
<option>Cauliflower</option>
<option>Okra</option>

</select>

<button onclick="getCropInfo()">

📖 Get Information

</button>

<div id="result" class="result">
    <h2>🌾 Crop Details</h2>

<p><b>🌱 Suitable Soil :</b>
<span id="soil">--</span></p>

<p><b>🌦 Suitable Climate :</b>
<span id="climate">--</span></p>

<p><b>💧 Water Requirement :</b>
<span id="water">--</span></p>

<p><b>🌿 Recommended Fertilizer :</b>
<span id="fertilizer">--</span></p>

<p><b>🌾 Harvest Time :</b>
<span id="harvest">--</span></p>

<p><b>📈 Average Yield :</b>
<span id="yield">--</span></p>

<p><b>📍 Major Producing States :</b>
<span id="states">--</span></p>

</div>

<br>

<a href="dashboard.html">
<button>
    <button onclick="downloadCropPDF()">

📄 Download Crop Information PDF

</button>

<br><br>
⬅ Back To Dashboard
</button>
</a>

</div>

<footer style="margin-top:40px;background:#2e7d32;color:white;text-align:center;padding:20px;">

<h2>🌾 AgriConnect</h2>

<p>Crop Information System</p>

</footer>

<script src="cropinfo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
